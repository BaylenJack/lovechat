<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b1e">
<title>lovechat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23a855f7'/><stop offset='1' stop-color='%23ec4899'/></linearGradient></defs><circle cx='16' cy='16' r='13' fill='%230a0b1e'/><path d='M11 16 L14 19 L21 12' stroke='url(%23g)' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="/style.css?v=3">
</head>
<body>

<!-- ===== 登录/进入 ===== -->
<div id="lobby" class="lobby">
  <div class="lobby-card">
    <div class="brand">
      <h1 class="brand-name">lovechat</h1>
      <p class="brand-sub">两人的私人空间</p>
    </div>
    <label class="field">
      <span class="field-label">你的名字</span>
      <input id="nameInput" class="field-input" maxlength="16" placeholder="输入你的名字" autocomplete="off">
    </label>
    <label class="field">
      <span class="field-label">房间名</span>
      <input id="roomInput" class="field-input" maxlength="32" placeholder="两人约定同一个房间名" autocomplete="off">
    </label>
    <label class="field">
      <span class="field-label">房间密码</span>
      <input id="passInput" class="field-input" maxlength="64" type="password" placeholder="新房间可设置，已有房间需填写" autocomplete="off">
    </label>
    <button id="enterBtn" class="btn-primary">进入 →</button>
    <p class="hint">告诉对方同一个房间名和密码，你们就能在这里聊天了。</p>
  </div>
</div>

<!-- ===== 聊天主界面 ===== -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="back" id="backBtn">‹</div>
    <div class="peer">
      <div class="peer-avatar" id="peerAvatar">?</div>
      <div class="peer-info">
        <div class="peer-name" id="peerName">对方</div>
        <div class="peer-status" id="peerStatus">连接中…</div>
      </div>
    </div>
    <button id="momentsBtn" class="icon-btn" title="动态">🌙</button>
    <button id="settingsBtn" class="icon-btn" title="设置">⚙️</button>
    <button id="callBtn" class="icon-btn primary" title="语音通话">📞</button>
  </header>

  <div id="msgList" class="msg-list">
    <div class="day-divider">开始聊天吧</div>
  </div>

  <!-- ===== 动态视图 ===== -->
  <div id="momentsView" class="moments hidden">
    <div class="moment-compose">
      <textarea id="momentText" class="moment-text" maxlength="1000" rows="2" placeholder="想分享点什么…"></textarea>
      <div id="momentPics" class="moment-pics"></div>
      <div class="moment-actions">
        <button id="momentPicBtn" class="btn-mini ghost">📷 加图</button>
        <button id="momentSend" class="btn-mini">发布</button>
      </div>
    </div>
    <div id="momentList" class="moment-list"></div>
  </div>
  <input type="file" id="momentPicker" class="hidden" accept="image/*" multiple>

  <footer id="inputbar" class="inputbar">
    <button id="micBtn" class="input-btn" title="按住说话">🎤</button>
    <button id="imgBtn" class="input-btn" title="发送照片">📷</button>
    <button id="fileBtn" class="input-btn" title="发送文件">📎</button>
    <button id="emojiBtn" class="input-btn" title="表情">😊</button>
    <input id="textInput" class="text-input" type="text" placeholder="输入消息…" autocomplete="off">
    <button id="sendBtn" class="send-btn hidden">发送</button>

    <!-- 表情面板 -->
    <div id="emojiPanel" class="emoji-panel hidden"></div>

    <!-- 按住说话覆盖层 -->
    <div id="recordingOverlay" class="recording hidden">
      <div class="rec-order">松开发送 · 上滑取消</div>
      <div class="rec-timer" id="recTimer">0:00</div>
    </div>
  </footer>
  <input type="file" id="filePicker" class="hidden" accept="*">
  <input type="file" id="imgPicker" class="hidden" accept="image/*">
</div>

<!-- ===== 通话覆盖层 ===== -->
<div id="callOverlay" class="call-overlay hidden">
  <div class="call-card">
    <div class="call-avatar" id="callAvatar">?</div>
    <div class="call-title" id="callTitle">语音通话</div>
    <div class="call-status" id="callStatus">呼叫中…</div>
    <div class="call-actions">
      <button id="callReject" class="call-btn-round call-reject hidden">✕</button>
      <button id="callAccept" class="call-btn-round call-accept hidden">✓</button>
      <button id="callHangup" class="call-btn-round call-hangup hidden">✕</button>
    </div>
  </div>
</div>

<!-- ===== 设置面板 ===== -->
<div id="settingsOverlay" class="call-overlay hidden">
  <div class="call-card settings-card">
    <div class="call-title" style="text-align: center; margin-bottom: 8px;">设置</div>
    <div class="setting-row">
      <div>
        <div class="setting-label">我的头像</div>
        <div class="setting-sub">换头像后对方也能看到</div>
      </div>
      <div class="setting-actions">
        <img id="myAvatarPrev" class="avatar-preview" alt="">
        <button id="pickAvatarBtn" class="btn-mini">更换</button>
      </div>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-label">聊天背景</div>
        <div class="setting-sub">仅自己可见</div>
      </div>
      <div class="setting-actions">
        <button id="pickBgBtn" class="btn-mini">更换</button>
        <button id="resetBgBtn" class="btn-mini ghost">恢复默认</button>
      </div>
    </div>
    <div class="call-actions">
      <button id="settingsClose" class="btn-mini ghost">关闭</button>
    </div>
  </div>
</div>
<input type="file" id="avatarPicker" class="hidden" accept="image/*">
<input type="file" id="bgPicker" class="hidden" accept="image/*">

<!-- ===== 头像裁剪器(微信式正方形选区) ===== -->
<div id="cropOverlay" class="call-overlay hidden">
  <div class="crop-card">
    <div class="crop-title">调整头像</div>
    <div class="crop-stage" id="cropStage">
      <img id="cropImg" alt="">
      <div class="crop-box" id="cropBox"><span class="crop-grip grip-nw"></span><span class="crop-grip grip-ne"></span><span class="crop-grip grip-sw"></span><span class="crop-grip grip-se"></span></div>
      <div class="crop-hint">拖动移动 · 缩放框调整大小</div>
    </div>
    <div class="crop-actions">
      <button id="cropCancel" class="btn-mini ghost">取消</button>
      <button id="cropConfirm" class="btn-mini">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/app.js?v=3"></script>
</body>
</html>
