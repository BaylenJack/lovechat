# coturn TURN 服务器配置示例
# 替换 realm / user / external-ip 后保存到 /etc/turnserver.conf
# 腾讯云 / 阿里云安全组需放行:
#   TCP 3478   - TURN 控制信令
#   UDP 3478   - TURN 核心
#   UDP 49152-65535 - TURN 中继数据通道(媒体流)

listening-port=3478
tls-listening-port=5349
realm=yourdomain.com
server-name=yourdomain.com

# 凭据 — 替换为强密码
user=lovechat:CHANGE_ME_TO_STRONG_PASSWORD

# 中继端口范围
min-port=49152
max-port=65535

# 服务器公网 IP
external-ip=YOUR_SERVER_PUBLIC_IP

# 日志
log-file=/var/log/turnserver.log
simple-log

# WebRTC 支持
fingerprint
lt-cred-mech
no-cli